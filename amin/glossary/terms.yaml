# قاموس «أمين» للمصطلحات الشرعية — على منهج السلف الصالح
#
# القاعدة الذهبية: يُكتب المصطلح الشرعي بلفظه العربي بالحروف اللاتينية أولًا،
# ثم الترجمة الأقرب بين قوسين. مثال: Shaheed (Martyr)
#
# الحقول:
#   id            معرّف فريد
#   ar            صيغ المصطلح في العربية (تُطبَّع قبل المطابقة)
#   translit      أنماط اللفظ المنقول بالحروف اللاتينية (تعابير نمطية، بلا حساسية لحالة الأحرف)
#   gloss         كلمات الترجمة المجردة لكل لغة؛ ورودها وحدها دون اللفظ العربي = مخالفة للقاعدة الذهبية
#   forbidden     مقابلات خاطئة أو مسيئة لكل لغة
#   forbidden_type نوع الخلل عند ورود مقابل محظور (1 حمولة دخيلة، 2 مسيء)
#   approved      الصيغة المعتمدة المقترحة لكل لغة
#   note_ar       تعريف المصطلح بأسلوب دعوي على منهج السلف
#   source        مرجع المقابل المعتمد
#   global        true = يُفحص المقابل المحظور ولو لم يرد المصطلح في الأصل العربي
#   reviewed      false حتى يعتمده المراجع الشرعي
#
# مصادر المقابلات: ترجمة الهلالي وخان (en-al-hilali-khan) وترجمة حميد الله (fr-hamidullah)
# كما جُلبت من quran.com عبر أداة Quran_AI بتاريخ 2026-09-26.


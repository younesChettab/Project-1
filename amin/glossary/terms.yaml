# ─── الصفات: تُثبت على منهج السلف بلا تحريف ولا تعطيل ولا تكييف ولا تمثيل ───
attributes:

  - id: sifah-yad
    name_ar: 'صفة اليد'
    ar: ['يد الله', 'يداه', 'بيدي', 'بيده', 'يدي الله', 'بيمينه']
    tawil:
      en: ['(?:god|allah)[’'']s\s+(?:power|might|bounty|favou?rs?|blessings?|strength|support|authority|protection)',
           '(?:power|might|bounty|favou?rs?|blessings?|strength|support|authority|protection)\s+of\s+(?:god|allah)',
           '\bhis\s+(?:power|might|bounty|favou?rs?|blessings?|strength)\b',
           'with\s+my\s+(?:own\s+)?(?:power|might|strength)']
      fr: ['(?:la\s+)?(?:puissance|pouvoir|force|faveurs?|bienfaits?|générosité|protection|soutien)\s+d[’'']\s?allah',
           '(?:la\s+)?(?:puissance|pouvoir|force|faveurs?|bienfaits?|générosité)\s+de\s+dieu',
           '\bsa\s+(?:puissance|force|générosité)\b',
           'de\s+ma\s+(?:puissance|force)']

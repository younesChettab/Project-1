# نقول موثقة فقط — كل نص هنا منقول حرفيًّا من نتيجة أداة تحقق، مع رابط المصدر.
# لا يُضاف نقل من الذاكرة. ترقيم الصفحات بحسب منصة «تراث» (turath.io) للطبعة المعتمدة فيها.

quotes:

  - id: ibn-taymiyyah-tadmuriyyah-asl2
    author: 'شيخ الإسلام ابن تيمية'
    book: 'التدمرية'
    locator: 'ج1 ص43'
    link: 'https://app.turath.io/book/22666?page=44'
    retrieved: '2026-09-26 عبر أداة Turath'
    text: 'وهذا يتبين بالأصل الثاني - وهو أن يقال: القول في الصفات كالقول في الذات، فإن الله ليس كمثله شيء، لا في ذاته، ولا في صفاته، ولا في أفعاله، فإذا كان له ذات حقيقة لا تماثل الذوات، فالذات متصفة بصفات حقيقة لا تماثل صفات سائر الذوات.'

  - id: ibn-taymiyyah-tadmuriyyah-istiwa
    author: 'شيخ الإسلام ابن تيمية'
    book: 'التدمرية'
    locator: 'ج1 ص43-44'
    link: 'https://app.turath.io/book/22666?page=45'
    retrieved: '2026-09-26 عبر أداة Turath'
    text: 'فإذا قال السائل: كيف استوى على العرش؟ قيل له - كما قال ربيعة ومالك وغيرهما -: الاستواء معلوم، والكيف مجهول، والإيمان به واجب، والسؤال عن الكيفية بدعة، لأنه سؤال عمّا لا يعلمه البشر، ولا يمكنهم الإجابة عنه. وكذلك إذا قال: كيف ينزل ربنا إلى سماء الدنيا؟ قيل له: كيف هو؟ فإذا قال: أنا لا أعلم كيفيته. قيل له: ونحن لا نعلم كيفية نزوله، إذ العلم بكيفية الصفة يستلزم العلم بكيفية الموصوف، وهو فرع له، وتابع له.'

  - id: ibn-taymiyyah-madaniyyah-yadayn
    author: 'شيخ الإسلام ابن تيمية'
    book: 'الرسالة المدنية في تحقيق المجاز والحقيقة في صفات الله (مطبوع ضمن الفتوى الحموية الكبرى)'
    locator: 'ج1 ص10'
    link: 'https://app.turath.io/book/7635?page=9'
    retrieved: '2026-09-26 عبر أداة Turath'
    text: 'فقوله ﴿لِمَا خَلَقْتُ بِيَدَيَّ﴾ لا يجوز أن يراد به القدرة لأن القدرة صفة واحدة ولا يجوز أن يعبر بالاثنين عن الواحد ولا يجوز أن يراد به النعمة لأن نعم الله لا تحصى فلا يجوز أن يعبر عن النعم التي لا تحصى بصيغة التثنية'

hadith:

  - id: 'bukhari:1145'
    collection: 'صحيح البخاري'
    number: '1145'
    grade: 'متفق عليه (بحسب محمد فؤاد عبد الباقي)'
    link: 'https://hadithunlocked.com/bukhari/19/14'
    retrieved: '2026-09-26 عبر أداة Hadith Unlocked'
    ar: 'يَنْزِلُ رَبُّنَا تَبَارَكَ وَتَعَالَى كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ'
    en: 'Our Lord, blessed and exalted, descends every night to the lowest heaven when the last third of the night remains'

  - id: 'muslim:758a'
    collection: 'صحيح مسلم'
    number: '758a'
    grade: 'صحيح'
    link: 'https://hadithunlocked.com/muslim/6/24'
    retrieved: '2026-09-26 عبر أداة Hadith Unlocked'
    ar: 'يَنْزِلُ رَبُّنَا تَبَارَكَ وَتَعَالَى كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ'
    en: 'Our Lord, the Blessed and the Exalted, descends every night to the lowest heaven when one-third of the latter part of the night is left'

# آيات موثقة مع ترجمات معانيها المعتمدة.
# النص العربي: ar-simple-clean، والترجمات: en-al-hilali-khan و fr-hamidullah،
# كلها مجلوبة من quran.com عبر أداة Quran_AI بتاريخ 2026-09-26.
# تُحذف أرقام الحواشي من نصوص الترجمة.

editions:
  en: 'Al-Hilali & Muhsin Khan — The Noble Qur’an (مجمع الملك فهد)'
  fr: 'Muhammad Hamidullah — Le Saint Coran (نسخة quran.com)'

ayat:
  - ref: '48:10'
    ar: 'إِنَّ الَّذِينَ يُبَايِعُونَكَ إِنَّمَا يُبَايِعُونَ اللَّهَ يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ ۚ فَمَن نَّكَثَ فَإِنَّمَا يَنكُثُ عَلَىٰ نَفْسِهِ ۖ وَمَنْ أَوْفَىٰ بِمَا عَاهَدَ عَلَيْهُ اللَّهَ فَسَيُؤْتِيهِ أَجْرًا عَظِيمًا'
    en: 'Verily, those who give Bai‘ah (pledge) to you (O Muhammad صلى الله عليه وسلم) they are giving Bai‘ah (pledge) to Allâh. The Hand of Allâh is over their hands. Then whosoever breaks his pledge, breaks it only to his own harm; and whosoever fulfils what he has covenanted with Allâh, He will bestow on him a great reward.'
    fr: 'Ceux qui te prêtent serment d’allégeance ne font que prêter serment à Allah : la main d’Allah est au-dessus de leurs mains. Quiconque viole le serment, ne le viole qu’à son propre détriment ; et quiconque remplit son engagement envers Allah, Il lui apportera bientôt une énorme récompense.'
  - ref: '7:54'
    ar: 'إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ يُغْشِي اللَّيْلَ النَّهَارَ يَطْلُبُهُ حَثِيثًا وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومَ مُسَخَّرَاتٍ بِأَمْرِهِ ۗ أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ ۗ تَبَارَكَ اللَّهُ رَبُّ الْعَالَمِينَ'
    en: 'Indeed your Lord is Allâh, Who created the heavens and the earth in Six Days, and then He rose over (Istawâ) the Throne (really in a manner that suits His Majesty). He brings the night as a cover over the day, seeking it rapidly, and (He created) the sun, the moon, the stars subjected to His Command. Surely, His is the Creation and Commandment. Blessed is Allâh, the Lord of the ‘Âlamîn (mankind, jinn and all that exists)!'
    fr: 'Votre Seigneur est Allah, Celui qui a créé les cieux et la Terre en six jours, puis S’est établi (Istawâ) sur le Trône. Il couvre le jour de la nuit qui poursuit celui-ci sans arrêt. (Il a créé) le soleil, la lune et les étoiles, soumis à Son commandement. La création et le commandement n’appartiennent qu’à Lui. Béni soit Allah, Seigneur de l’Univers !'
  - ref: '20:5'
    ar: 'الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ'
    en: 'The Most Gracious (Allâh) rose over (Istawâ) the (Mighty) Throne (in a manner that suits His Majesty).'
    fr: 'Le Tout Miséricordieux S’est établi (Istawâ) sur le Trône.'
  - ref: '55:27'
    ar: 'وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ'
    en: 'And the Face of your Lord full of Majesty and Honour will remain forever.'
    fr: '[Seule] subsistera La Face [Wajh] de ton Seigneur, plein de majesté et de noblesse.'
  - ref: '20:39'
    ar: 'أَنِ اقْذِفِيهِ فِي التَّابُوتِ فَاقْذِفِيهِ فِي الْيَمِّ فَلْيُلْقِهِ الْيَمُّ بِالسَّاحِلِ يَأْخُذْهُ عَدُوٌّ لِّي وَعَدُوٌّ لَّهُ ۚ وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةً مِّنِّي وَلِتُصْنَعَ عَلَىٰ عَيْنِي'
    en: '"Saying: ‘Put him (the child) into the Tabût (a box or a case or a chest) and put it into the river (Nile); then the river shall cast it up on the bank, and there, an enemy of Mine and an enemy of his shall take him.’ And I endued you with love from Me, in order that you may be brought up under My Eye.'
    fr: 'Mets-le dans le coffret, puis jette celui-ci dans les flots pour qu’ensuite le fleuve le lance sur la rive; un ennemi à Moi et à lui le prendra." Et J’ai répandu sur toi une affection de Ma part, afin que tu sois élevé sous Mon œil.'
  - ref: '89:22'
    ar: 'وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا'
    en: 'And your Lord comes with the angels in rows.'
    fr: 'et que ton Seigneur viendra ainsi que les Anges, rang par rang,'
  - ref: '38:75'
    ar: 'قَالَ يَا إِبْلِيسُ مَا مَنَعَكَ أَن تَسْجُدَ لِمَا خَلَقْتُ بِيَدَيَّ ۖ أَسْتَكْبَرْتَ أَمْ كُنتَ مِنَ الْعَالِينَ'
    en: '(Allâh) said: "O Iblîs (Satan)! What prevents you from prostrating yourself to one whom I have created with Both My Hands. Are you too proud (to fall prostrate to Adam) or are you one of the high exalted?"'
    fr: '(Allah) lui dit : "Ô Iblîs, qui t’a empêché de te prosterner devant ce que J’ai créé de Mes mains? T’enfles-tu d’orgueil ou te considères- tu parmi les hauts placés ?"'
  - ref: '5:64'
    ar: 'بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنفِقُ كَيْفَ يَشَاءُ'
    partial: true
    en: 'Nay, both His Hands are widely outstretched. He spends (of His Bounty) as He wills.'
    fr: 'Au contraire, Ses deux mains sont largement ouvertes, Il distribue Ses dons comme Il veut.'
  - ref: '10:62'
    ar: 'أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ'
    en: 'No doubt! Verily, the Auliyâ’ of Allâh [i.e. those who believe in the Oneness of Allâh and fear Allâh much (abstain from all kinds of sins and evil deeds which he has forbidden), and love Allâh much (perform all kinds of good deeds which He has ordained)], no fear shall come upon them nor shall they grieve.'
    fr: 'En vérité, les alliés d’Allah seront à l’abri de toute crainte, et ils ne seront point affligés,'
  - ref: '3:169'
    ar: 'وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا ۚ بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ'
    en: 'Think not of those who are killed in the Way of Allâh as dead. Nay, they are alive, with their Lord, and they have provision.'
    fr: 'Ne pense pas que ceux qui ont été tués dans le sentier d’Allah, soient morts. Au contraire, ils sont vivants, auprès de leur Seigneur, bien pourvus.'
  - ref: '2:43'
    ar: 'وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ'
    en: 'And perform As-Salât (Iqâmat-as-Salât), and give Zakât and bow down (or submit yourselves with obedience to Allâh) along with Ar-Raki‘ûn.'
    fr: 'Et accomplissez la prière (As-Ṣalāt), et acquittez l''aumône (Az-Zakāt), et inclinez-vous avec ceux qui s’inclinent.'
  - ref: '2:190'
    ar: 'وَقَاتِلُوا فِي سَبِيلِ اللَّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلَا تَعْتَدُوا ۚ إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ'
    en: 'And fight in the Way of Allâh those who fight you, but transgress not the limits. Truly, Allâh likes not the transgressors.'
    fr: 'Combattez dans le sentier d’Allah ceux qui vous combattent, et ne transgressez pas. Certes. Allah n’aime pas les transgresseurs !'
  - ref: '16:125'
    ar: 'ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ ۖ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ ۚ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِ ۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ'
    en: 'Invite (mankind, O Muhammad صلى الله عليه و سلم) to the Way of your Lord (i.e. Islâm) with wisdom (i.e. with the Divine Revelation and the Qur’ân) and fair preaching, and argue with them in a way that is better. Truly, your Lord knows best who has gone astray from His Path, and He is the Best Aware of those who are guided.'
    fr: 'Par la sagesse et la bonne exhortation appelle (les gens) au sentier de ton Seigneur. Et discute avec eux de la meilleure façon. Certes, ton Seigneur connaît le mieux celui qui s’égare de Son sentier et c’est Lui qui connaît le mieux ceux qui sont bien guidés.'
  - ref: '109:1'
    ar: 'قُلْ يَا أَيُّهَا الْكَافِرُونَ'
    en: 'Say: (O Muhammad صلى الله عليه وسلم to these Mushrikûn and Kâfirûn): "O Al-Kafirûn (disbelievers in Allâh, in His Oneness, in His Angels, in His Books, in His Messengers, in the Day of Resurrection, and in Al-Qadar)!'
    fr: 'Dis : "Ô vous les infidèles !'
  - ref: '112:1'
    ar: 'قُلْ هُوَ اللَّهُ أَحَدٌ'
    en: 'Say (O Muhammad صلى الله عليه وسلم): "He is Allâh, (the) One.'
    fr: 'Dis : "Il est Allah, Unique.'
  - ref: '112:4'
    ar: 'وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ'
    en: '"And there is none co-equal or comparable unto Him."'
    fr: 'Et nul n’est égal à Lui."'
  - ref: '2:21'
    ar: 'يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ'
    en: 'O mankind! Worship your Lord (Allâh), Who created you and those who were before you so that you may become Al-Muttaqûn (the pious).'
    fr: 'Ô hommes! Adorez votre Seigneur, qui vous a créés vous et ceux qui vous ont précédés. Ainsi atteindrez-vous à la piété.'
